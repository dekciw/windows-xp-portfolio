<div class="notepad_body calc">
  <section class="toolbar">
    <div class="toolbar_OCD">
      <div class="menu-item"><div class="menu-label">Правка</div></div>
      <div class="menu-item"><div class="menu-label">Вид</div></div>
      <div class="menu-item"><div class="menu-label">Справка</div></div>
    </div>
  </section>

  <div class="calc-grid">
    <input type="text" class="calculator-display calc-display" readonly value="0," aria-label="Результат">

    <!-- Система счисления / единицы углов -->
    <div class="calc-group calc-group--base" role="radiogroup" aria-label="Система счисления">
      <label class="calc-radio"><input type="radio" name="calc-base" value="16"><span>Hex</span></label>
      <label class="calc-radio"><input type="radio" name="calc-base" value="10" checked><span>Dec</span></label>
      <label class="calc-radio"><input type="radio" name="calc-base" value="8"><span>Oct</span></label>
      <label class="calc-radio"><input type="radio" name="calc-base" value="2"><span>Bin</span></label>
    </div>
    <div class="calc-group calc-group--angle" role="radiogroup" aria-label="Единицы углов">
      <label class="calc-radio"><input type="radio" name="calc-angle" value="deg" checked><span>Градусы</span></label>
      <label class="calc-radio"><input type="radio" name="calc-angle" value="rad"><span>Радианы</span></label>
      <label class="calc-radio"><input type="radio" name="calc-angle" value="grad"><span>Грады</span></label>
    </div>

    <!-- Inv / Hyp, индикаторы скобок и памяти, очистка -->
    <div class="calc-group calc-group--mods">
      <label class="calc-check"><input type="checkbox" data-mod="inv"><span>Inv</span></label>
      <label class="calc-check"><input type="checkbox" data-mod="hyp"><span>Hyp</span></label>
    </div>
    <div class="calc-indicator calc-indicator--paren" title="Открытые скобки"></div>
    <div class="calc-indicator calc-indicator--mem" title="Память"></div>
    <div class="calc-clear">
      <button type="button" class="calc-btn calc-btn--wide calc-red" data-key="back">Backspace</button>
      <button type="button" class="calc-btn calc-btn--wide calc-red" data-key="ce">CE</button>
      <button type="button" class="calc-btn calc-btn--wide calc-red" data-key="clear">C</button>
    </div>

    <!-- Ряд 1 -->
    <button type="button" class="calc-btn calc-blue" data-key="sta">Sta</button><span></span>
    <button type="button" class="calc-btn calc-fn" data-key="fe">F-E</button>
    <button type="button" class="calc-btn calc-fn" data-key="(">(</button>
    <button type="button" class="calc-btn calc-fn" data-key=")">)</button><span></span>
    <button type="button" class="calc-btn calc-red" data-key="mc">MC</button><span></span>
    <button type="button" class="calc-btn calc-blue" data-key="7">7</button>
    <button type="button" class="calc-btn calc-blue" data-key="8">8</button>
    <button type="button" class="calc-btn calc-blue" data-key="9">9</button>
    <button type="button" class="calc-btn calc-red" data-key="/">/</button>
    <button type="button" class="calc-btn calc-red" data-key="mod">Mod</button>
    <button type="button" class="calc-btn calc-red" data-key="and">And</button>

    <!-- Ряд 2 -->
    <button type="button" class="calc-btn calc-blue" data-key="ave">Ave</button><span></span>
    <button type="button" class="calc-btn calc-fn" data-key="dms">dms</button>
    <button type="button" class="calc-btn calc-fn" data-key="exp">Exp</button>
    <button type="button" class="calc-btn calc-fn" data-key="ln">ln</button><span></span>
    <button type="button" class="calc-btn calc-red" data-key="mr">MR</button><span></span>
    <button type="button" class="calc-btn calc-blue" data-key="4">4</button>
    <button type="button" class="calc-btn calc-blue" data-key="5">5</button>
    <button type="button" class="calc-btn calc-blue" data-key="6">6</button>
    <button type="button" class="calc-btn calc-red" data-key="*">*</button>
    <button type="button" class="calc-btn calc-red" data-key="or">Or</button>
    <button type="button" class="calc-btn calc-red" data-key="xor">Xor</button>

    <!-- Ряд 3 -->
    <button type="button" class="calc-btn calc-blue" data-key="sum">Sum</button><span></span>
    <button type="button" class="calc-btn calc-fn" data-key="sin">sin</button>
    <button type="button" class="calc-btn calc-fn" data-key="pow">x^y</button>
    <button type="button" class="calc-btn calc-fn" data-key="log">log</button><span></span>
    <button type="button" class="calc-btn calc-red" data-key="ms">MS</button><span></span>
    <button type="button" class="calc-btn calc-blue" data-key="1">1</button>
    <button type="button" class="calc-btn calc-blue" data-key="2">2</button>
    <button type="button" class="calc-btn calc-blue" data-key="3">3</button>
    <button type="button" class="calc-btn calc-red" data-key="-">-</button>
    <button type="button" class="calc-btn calc-red" data-key="lsh">Lsh</button>
    <button type="button" class="calc-btn calc-red" data-key="not">Not</button>

    <!-- Ряд 4 -->
    <button type="button" class="calc-btn calc-blue" data-key="s">s</button><span></span>
    <button type="button" class="calc-btn calc-fn" data-key="cos">cos</button>
    <button type="button" class="calc-btn calc-fn" data-key="cube">x^3</button>
    <button type="button" class="calc-btn calc-fn" data-key="fact">n!</button><span></span>
    <button type="button" class="calc-btn calc-red" data-key="m+">M+</button><span></span>
    <button type="button" class="calc-btn calc-blue" data-key="0">0</button>
    <button type="button" class="calc-btn calc-blue" data-key="neg">+/-</button>
    <button type="button" class="calc-btn calc-blue" data-key=".">,</button>
    <button type="button" class="calc-btn calc-red" data-key="+">+</button>
    <button type="button" class="calc-btn calc-red" data-key="=">=</button>
    <button type="button" class="calc-btn calc-red" data-key="int">Int</button>

    <!-- Ряд 5 -->
    <button type="button" class="calc-btn calc-blue" data-key="dat">Dat</button><span></span>
    <button type="button" class="calc-btn calc-fn" data-key="tan">tg</button>
    <button type="button" class="calc-btn calc-fn" data-key="sqr">x^2</button>
    <button type="button" class="calc-btn calc-fn" data-key="inv">1/x</button><span></span>
    <button type="button" class="calc-btn calc-blue" data-key="pi">pi</button><span></span>
    <button type="button" class="calc-btn calc-blue" data-key="A">A</button>
    <button type="button" class="calc-btn calc-blue" data-key="B">B</button>
    <button type="button" class="calc-btn calc-blue" data-key="C">C</button>
    <button type="button" class="calc-btn calc-blue" data-key="D">D</button>
    <button type="button" class="calc-btn calc-blue" data-key="E">E</button>
    <button type="button" class="calc-btn calc-blue" data-key="F">F</button>
  </div>
</div>
