<div class="mp-root computer_body">
  <section class="computer_toolbar">
    <div class="options">
      <div class="options_OCD">
        <div class="drop_down"><div class="drop_down_label">Файл</div></div>
        <div class="drop_down"><div class="drop_down_label">Вид</div></div>
        <div class="drop_down"><div class="drop_down_label mp-disabled" aria-disabled="true">Сервис</div></div>
        <div class="drop_down"><div class="drop_down_label mp-disabled" aria-disabled="true">Справка</div></div>
      </div>
    </div>
    <img
      class="windows_logo"
      src="/Assets/Images/Logos/windows-xp-logo-white-small.png"
      alt="windows"
    />
  </section>
  <section class="function_bar">
    <div class="function_bar_button mp-tool" data-mp-tool="home" data-mp-action="home" role="button">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/IE Home.png"
        alt=""
      /><span class="function_bar_text">Домой</span>
    </div>
    <div class="function_bar_separate"></div>
    <div class="function_bar_button--disable mp-tool" data-mp-tool="back">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Back.png"
        alt=""
      /><span class="function_bar_text">Назад</span>
    </div>
    <div class="function_bar_button--disable mp-tool" data-mp-tool="forward">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Forward.png"
        alt=""
      /><span class="function_bar_text">Вперёд</span>
    </div>
    <div class="function_bar_button--disable mp-tool" data-mp-tool="favorites">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Favorites.png"
        alt=""
      /><span class="function_bar_text">Избранное</span>
    </div>
    <div class="function_bar_separate"></div>
    <div class="function_bar_button mp-tool mp-theme-button" data-mp-action="theme" role="button">
      <img
        class="function_bar_icon"
        src="/Assets/Images/My Projects/theme-toggle.png"
        alt=""
      /><span class="function_bar_text">Светлая/Тёмная</span>
    </div>
  </section>
  <section class="address_bar">
    <div class="address_bar_title">Адрес</div>
    <div class="address_bar_content">
      <img
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/URL.png"
        alt=""
        class="address_bar_content_img"
      />
      <div class="address_bar_content_text mp-address">https://www.myprojects.com</div>
      <img src="/Assets/Images/Icons/down-arrow.png" alt="" class="address_bar_content_img" />
    </div>
    <div class="address_bar_go mp-go">
      <img
        class="address_bar_go_img"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Go.png"
        alt=""
      /><span class="address_bar_go_text">Переход</span>
    </div>
  </section>

  <div class="mp-page" data-theme="dark">
    <header class="mp-header">
      <div class="mp-header-left">
        <a class="mp-logo" href="#" data-mp-action="home" aria-label="MyProjects: все проекты">
          <img class="mp-logo-image" src="/Assets/Images/My%20Projects/logo.svg" width="159" height="53" alt="MyProjects" />
        </a>
      </div>
      <form class="mp-search" role="search">
        <input class="mp-search-input" type="search" placeholder="Поиск" aria-label="Поиск по проектам" autocomplete="off" />
        <button class="mp-search-button" type="submit" aria-label="Найти">
          <span class="mp-search-icon" aria-hidden="true"></span>
        </button>
      </form>
      <nav class="mp-social" aria-label="Соцсети"></nav>
    </header>

    <div class="mp-body">
      <nav class="mp-sidebar" aria-label="Категории"></nav>
      <main class="mp-main">
        <div class="mp-grid"></div>
        <div class="mp-empty" hidden>Ничего не найдено</div>
        <section class="mp-project" hidden></section>
      </main>
    </div>
  </div>

</div>
