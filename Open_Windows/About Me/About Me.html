<div class="am-root computer_body">
  <section class="computer_toolbar">
    <div class="options">
      <div class="options_OCD">
        <div class="drop_down"><div class="drop_down_label">Файл</div></div>
        <div class="drop_down"><div class="drop_down_label">Правка</div></div>
        <div class="drop_down"><div class="drop_down_label">Вид</div></div>
        <div class="drop_down"><div class="drop_down_label">Избранное</div></div>
        <div class="drop_down"><div class="drop_down_label">Сервис</div></div>
        <div class="drop_down"><div class="drop_down_label">Справка</div></div>
      </div>
    </div>
    <img
      class="windows_logo"
      src="/Assets/Images/Logos/windows-xp-logo-white-small.png"
      alt="windows"
    />
  </section>
  <section class="function_bar">
    <div class="function_bar_button--disable" data-am-nav="back">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Back.png"
        alt=""
      /><span class="function_bar_text">Назад</span>
    </div>
    <div class="function_bar_button--disable" data-am-nav="forward">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Forward.png"
        alt=""
      /><span class="function_bar_text">Вперёд</span>
    </div>
    <div class="function_bar_separate"></div>
    <div class="function_bar_button am-action" data-am-action="projects">
      <img
        class="function_bar_icon--normalize"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Internet Explorer 6.png"
        alt=""
      /><span class="function_bar_text">Мои проекты</span>
    </div>
    <div class="function_bar_button am-action" data-am-action="resume">
      <img
        class="function_bar_icon--normalize"
        src="/Assets/Images/Icons/pdf-icon.svg"
        alt=""
      /><span class="function_bar_text">Моё резюме</span>
    </div>
    <div class="function_bar_separate"></div>
    <div class="function_bar_button--disable" data-am-nav="up">
      <img
        class="function_bar_icon--normalize"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Folder Opened.png"
        alt=""
      />
    </div>
  </section>
  <section class="address_bar">
    <div class="address_bar_title">Адрес</div>
    <div class="address_bar_content">
      <img
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/About Me.png"
        alt=""
        class="address_bar_content_img"
      />
      <div class="address_bar_content_text">Обо мне</div>
      <img
        src="/Assets/Images/Icons/down-arrow.png"
        alt=""
        class="address_bar_content_img"
      />
    </div>
    <div class="address_bar_go">
      <img
        class="address_bar_go_img"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Go.png"
        alt=""
      /><span class="address_bar_go_text">Переход</span>
    </div>
  </section>
  <div class="am-body">
    <aside class="am-sidebar content_left"></aside>
    <main class="am-main">
      <div class="am-profile"></div>
      <div class="am-projects" hidden></div>
    </main>
  </div>
  <img
    class="am-watermark"
    src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Control Panel.png"
    alt=""
  />
</div>
