<div class="rs-root computer_body">
  <section class="computer_toolbar">
    <div class="options">
      <div class="options_OCD">
        <div class="drop_down"><div class="drop_down_label">Файл</div></div>
        <div class="drop_down"><div class="drop_down_label">Вид</div></div>
        <div class="drop_down"><div class="drop_down_label rs-disabled" aria-disabled="true">Справка</div></div>
      </div>
    </div>
    <img
      class="windows_logo"
      src="/Assets/Images/Logos/windows-xp-logo-white-small.png"
      alt="windows"
    />
  </section>
  <section class="function_bar">
    <div class="function_bar_button rs-action" data-rs-action="zoom" role="button">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Magnifier.png"
        alt=""
      /><span class="function_bar_text">Масштаб</span>
    </div>
    <a
      class="function_bar_button rs-action"
      data-rs-action="save"
      href="/Assets/Docs/resume.pdf"
      download="Резюме Атанов Роман.pdf"
    >
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Save.png"
        alt=""
      /><span class="function_bar_text">Сохранить</span>
    </a>
    <div class="function_bar_separate"></div>
    <div class="function_bar_button--disable" data-rs-action="print">
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Printer.png"
        alt=""
      /><span class="function_bar_text">Печать</span>
    </div>
    <div class="function_bar_separate"></div>
    <a
      class="function_bar_button rs-action"
      data-rs-action="contact"
      href="https://t.me/atanov_roman"
      target="_blank"
      rel="noreferrer"
    >
      <img
        class="function_bar_icon"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Email.png"
        alt=""
      /><span class="function_bar_text">Связаться со мной</span>
    </a>
  </section>
  <div class="rs-viewer" data-zoom="fit"></div>
  <footer class="rs-status">Щёлкните, чтобы увеличить, затем перетащите</footer>
</div>
